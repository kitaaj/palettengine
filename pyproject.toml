[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palette-generator"
version = "0.2.0"
description = "Perceptual, accessible color palette generator with a color-theory engine and optional ML layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "palette_generator authors" }]
keywords = ["color", "palette", "oklab", "oklch", "wcag", "design", "accessibility"]
dependencies = []

[project.optional-dependencies]
image = ["numpy>=1.26", "Pillow>=10.0"]
video = ["numpy>=1.26", "Pillow>=10.0", "imageio>=2.31", "av>=11.0"]
ml = ["numpy>=1.26", "scikit-learn>=1.3"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "hypothesis>=6.90", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
palette = "palette_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["palette_generator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# numpy operations are typed loosely; keep strictness but tolerate Any-returning
# array expressions in the extraction layer.
[[tool.mypy.overrides]]
module = "palette_generator.extract.*"
warn_return_any = false
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
